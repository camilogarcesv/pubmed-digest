# pnpm 10+ reads settings from here (no longer from the "pnpm" key in package.json).
# esbuild ships a prebuilt binary via a postinstall step; tsx and vitest depend on it.
allowBuilds:
  esbuild: true

# vitest 3.2.7 accepts vite ^5 || ^6 || ^7 but resolves to vite 5, which carries five known
# advisories (vite path traversal + fs.deny bypass, and postcss/esbuild transitively). Forcing
# vite 6 clears all of them without the vitest 4 major, which is pinned back in dependabot.yml
# because it crashes at startup. Dev-only: vite never reaches the published output.
# Re-evaluate when the vitest 4 line is usable and this override can go away.
overrides:
  vite: ^6.4.3
  postcss: ^8.5.18
