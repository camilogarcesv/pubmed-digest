# Cloudflare Worker config. Deploy from this directory: `npx wrangler deploy`.
# Secrets (never in this file): `npx wrangler secret put TELEGRAM_BOT_TOKEN`, then
# TELEGRAM_WEBHOOK_SECRET and VOTES_READ_SECRET the same way.

name = "pubmed-digest-votes"
main = "worker.ts"
compatibility_date = "2026-07-01"

# Created with: npx wrangler kv namespace create VOTES
# The id is an account-scoped identifier, not a credential — it is useless without the
# account's own auth, which is why Cloudflare's own docs commit it. Replace it if you
# deploy this under a different account.
[[kv_namespaces]]
binding = "VOTES"
id = "65a1d87e8d3240d895f8b998b31ba197"
